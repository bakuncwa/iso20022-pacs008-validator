# rapide configuration. Keys verified against rapide commit d96f648 (the README example is illustrative).
# Countries must exist in rapide's BIC data (US, TH, GB, CA, IE, IN, MX), or messages are lost: see GAP-7.
# rapide takes BICs inline, not as file paths. generator/reference/*.csv hold the same fictitious lists.
# It is copied to rapide's pacs008/ directory, where Spring Boot layers it over the packaged defaults.
rapide:
  PurposeCode:
    - CASH
    - SALA
    - SUPP
    - TRAD
    - INTC
  Currency:
    - Country: US
      Code: USD
    - Country: IE
      Code: EUR
    - Country: GB
      Code: GBP
    - Country: CA
      Code: CAD
    - Country: MX
      Code: MXN
    - Country: TH
      Code: THB
  SourceBicList:
