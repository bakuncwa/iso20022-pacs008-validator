name: codeql

# Static application security testing (SAST) for the C# solution: every push to main,
# every pull request, and a weekly run so new CodeQL queries reach unchanged code.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended
      - run: dotnet build -c Release
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
